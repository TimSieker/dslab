# CORDEX-ML-Bench Experiment 2 "Emulator hist+future", ALPS domain.
# Train on perfect predictors 1961-1980 + 2080-2099; test interpolation on 2041-2060.
# Not used yet (2026-10-30: ESD only); kept so the pipeline can be pointed at it unchanged.
name: alps_emulator
domain: ALPS
description: Emulator hist+future, ALPS, CNRM-CM5-driven ALADIN63, train 1961-1980 + 2080-2099
truth: CNRM-CM5-driven ALADIN63 regional climate model, 12.5 km  # what the targets are (for captions)
data_root: /work/bb1596/b384340/cordex-ml-bench/data/benchmark/ALPS_domain
variables: [pr, tasmax]
predictors: [u_850, u_700, u_500, v_850, v_700, v_500, t_850, t_700, t_500,
             z_850, z_700, z_500, q_850, q_700, q_500]
static: train/Emulator_hist_future/predictors/Static_fields.nc

# Projection of the target grid (fitted to the files' x/y vs lat/lon, max error 1 mm): ALADIN63
# Lambert conformal on a sphere. Used for maps; omit for regular lat/lon target grids.
grid_crs: {proj: lcc, lat_0: 49.5, lon_0: 10.5, lat_1: 49.5, lat_2: 49.5, x_0: 2825000, y_0: 2825000,
           R: 6371229, coord_units: km}

train:
  predictors: train/Emulator_hist_future/predictors/CNRM-CM5_1961-1980_2080-2099.nc
  target: train/Emulator_hist_future/target/pr_tasmax_CNRM-CM5_1961-1980_2080-2099.nc
val_years: [1967, 1975, 2087, 2095]

tests:
  # Test 1: perfect cross-validation (historical)
  historical_perfect:
    predictors: test/historical/predictors/perfect/CNRM-CM5_1981-2000.nc
    target: test/historical/target/pr_tasmax_CNRM-CM5_1981-2000.nc
  # Test 2: imperfect cross-validation
  historical_imperfect:
    predictors: test/historical/predictors/imperfect/CNRM-CM5_1981-2000.nc
    target: test/historical/target/pr_tasmax_CNRM-CM5_1981-2000.nc
  # Test 3: perfect interpolation (2041-2060, same GCM)
  mid_century_perfect:
    predictors: test/mid_century/predictors/perfect/CNRM-CM5_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_CNRM-CM5_2041-2060.nc
  # Test 4: imperfect interpolation
  mid_century_imperfect:
    predictors: test/mid_century/predictors/imperfect/CNRM-CM5_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_CNRM-CM5_2041-2060.nc
  # Test 5 / 6: perfect / imperfect interpolation, GCM transferability (RCM driven by MPI-ESM-LR)
  mid_century_perfect_MPI-ESM-LR:
    predictors: test/mid_century/predictors/perfect/MPI-ESM-LR_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_MPI-ESM-LR_2041-2060.nc
  mid_century_imperfect_MPI-ESM-LR:
    predictors: test/mid_century/predictors/imperfect/MPI-ESM-LR_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_MPI-ESM-LR_2041-2060.nc

combined_splits: {}

benchmark_tests:
  - {test: Test 1, name: perfect cross-validation, split: historical_perfect}
  - {test: Test 2, name: imperfect cross-validation, split: historical_imperfect}
  - {test: Test 3, name: perfect interpolation, split: mid_century_perfect}
  - {test: Test 4, name: imperfect interpolation, split: mid_century_imperfect}
  - {test: Test 5, name: perfect interpolation (GCM transferability), split: mid_century_perfect_MPI-ESM-LR}
  - {test: Test 6, name: imperfect interpolation (GCM transferability), split: mid_century_imperfect_MPI-ESM-LR}

default_splits: [val, historical_perfect, mid_century_perfect]
default_eval_splits: [val, historical_perfect, mid_century_perfect]
reference:
  experiment: Emulator_hist_future
  domain: ALPS
  splits: {historical_perfect: upper_left, mid_century_perfect: lower_right}

# Extra fields of the same RCM run from the DKRZ CORDEX pool (EUR-11, native 453 x 453 Lambert grid), cut to the
# benchmark's 128 x 128 window (index ranges, end exclusive), for the law tests and joint downscaling;
# `dslab extract` writes them to work/cache/<domain>/extra/<period>/. Years <= 2005 are in "historical".
extra:
  root: /work/kd0956/CORDEX/data/cordex/output/EUR-11/CNRM/CNRM-CERFACS-CNRM-CM5
  run: r1i1p1/CNRM-ALADIN63/v2
  window: {x: [165, 293], y: [113, 241]}
  periods: {p1961_1980: [1961, 1980], p1981_2000: [1981, 2000], p2041_2060: [2041, 2060], p2080_2099: [2080, 2099]}
  # the driving GCM's own daily fields (CMIP5 pool), conservatively regridded to the 2° predictor grid: the
  # coarse counterparts of pr and tas with imperfect predictors (`dslab extract --gcm`)
  gcm:
    root: /work/kd0956/CMIP5_waterpark/data/cmip5/output1/CNRM-CERFACS/CNRM-CM5
    path: day/atmos/day/r1i1p1
    variables: [pr, tas]
