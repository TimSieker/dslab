# CORDEX-ML-Bench Experiment 2 "Emulator hist+future", ALPS domain.
# Train on perfect predictors 1961-1980 + 2080-2099; test interpolation on 2041-2060.
# Not used yet (2026-10-30: ESD only); kept so the pipeline can be pointed at it unchanged.
name: alps_emulator
domain: ALPS
description: Emulator hist+future, ALPS, CNRM-CM5-driven ALADIN63, train 1961-1980 + 2080-2099
data_root: /work/bb1596/b384340/cordex-ml-bench/data/benchmark/ALPS_domain
variables: [pr, tasmax]
predictors: [u_850, u_700, u_500, v_850, v_700, v_500, t_850, t_700, t_500,
             z_850, z_700, z_500, q_850, q_700, q_500]
static: train/Emulator_hist_future/predictors/Static_fields.nc

# Projection of the target grid (fitted to the files' x/y vs lat/lon, max error 1 mm): ALADIN63
# Lambert conformal on a sphere. Used for maps; omit for regular lat/lon target grids.
grid_crs: {proj: lcc, lat_0: 49.5, lon_0: 10.5, lat_1: 49.5, lat_2: 49.5, x_0: 2825000, y_0: 2825000,
           R: 6371229, coord_units: km}

train:
  predictors: train/Emulator_hist_future/predictors/CNRM-CM5_1961-1980_2080-2099.nc
  target: train/Emulator_hist_future/target/pr_tasmax_CNRM-CM5_1961-1980_2080-2099.nc
val_years: [1967, 1975, 2087, 2095]

tests:
  historical_perfect:
    predictors: test/historical/predictors/perfect/CNRM-CM5_1981-2000.nc
    target: test/historical/target/pr_tasmax_CNRM-CM5_1981-2000.nc
  mid_century_perfect:
    predictors: test/mid_century/predictors/perfect/CNRM-CM5_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_CNRM-CM5_2041-2060.nc
  historical_imperfect:
    predictors: test/historical/predictors/imperfect/CNRM-CM5_1981-2000.nc
    target: test/historical/target/pr_tasmax_CNRM-CM5_1981-2000.nc
  mid_century_perfect_MPI-ESM-LR:
    predictors: test/mid_century/predictors/perfect/MPI-ESM-LR_2041-2060.nc
    target: test/mid_century/target/pr_tasmax_MPI-ESM-LR_2041-2060.nc

combined_splits: {}
default_splits: [val, historical_perfect, mid_century_perfect]
default_eval_splits: [val, historical_perfect, mid_century_perfect]
reference:
  experiment: Emulator_hist_future
  domain: ALPS
  splits: {historical_perfect: upper_left, mid_century_perfect: lower_right}
